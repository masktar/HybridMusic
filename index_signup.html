<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="main1.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="logo-box">
                <img src="pic/Logo.png" alt="Logo">
            </div>
        </div>
        
        <div class="right-section">
            <div class="form-content">
                <h2>Sign Up</h2>
                <div class="subtitle">
                    Already have an account? <br>
                    You can <a href="index_login.html" class="link-register">Login here!</a>
                </div>
                
                <form action="index.html">
                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input class="input-field" type="email" placeholder="Enter your email address">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Username</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input class="input-field" type="text" placeholder="Enter your User name">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input class="input-field" type="password" placeholder="Enter your Password">
                            <i class="fa-regular fa-eye-slash toggle-password"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input class="input-field" type="password" placeholder="Confirm your Password">
                            <i class="fa-regular fa-eye-slash toggle-password"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login btn-register">Register</button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
